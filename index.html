<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRコードスキャナー</title>
    <!-- iOSで最も安定して動作するjsQRライブラリを使用 -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        #video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        #result-box {
            margin-top: 20px;
            padding: 20px;
            background-color: #ffffff;
            font-size: 1.2em;
            font-weight: bold;
            word-break: break-all;
            border-radius: 8px;
            border: 2px solid #ccc;
        }
        .success {
            background-color: #d4edda !important;
            border-color: #c3e6cb !important;
            color: #155724;
        }
    </style>
</head>
<body>

    <h2>QRコードスキャナー</h2>

    <div id="video-container">
        <!-- カメラ映像 -->
        <video id="video" playsinline></video>
    </div>

    <!-- 結果表示枠 -->
    <div id="result-box">QRコードをカメラにかざしてください</div>

    <!-- キャンバス（非表示で画像処理に使用） -->
    <canvas id="canvas" hidden></canvas>

    <script>
        const video = document.getElementById("video");
        const canvasElement = document.getElementById("canvas");
        const canvas = canvasElement.getContext("2d");
        const resultBox = document.getElementById("result-box");
        let isScanned = false;

        // 背面カメラの起動
        navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" }
        }).then(function(stream) {
            video.srcObject = stream;
            video.setAttribute("playsinline", true); // iOSで全画面表示化を防ぐ
            video.play();
            requestAnimationFrame(tick);
        }).catch(function(err) {
            resultBox.innerText = "カメラの起動に失敗しました: " + err;
        });

        // 毎フレーム画像解析を行う処理
        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && !isScanned) {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                
                // 画像データの取得
                const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                
                // jsQRで解析
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert",
                });

                // QRコードを発見した場合
                if (code && code.data !== "") {
                    isScanned = true; // 連続読み取り防止
                    
                    // バイブレーション（対応端末）
                    if (navigator.vibrate) navigator.vibrate(200);

                    // 画面の見た目を変更
                    resultBox.classList.add("success");
                    
                    // URLの場合はリンク、文字の場合はテキストを表示
                    if (code.data.startsWith('http://') || code.data.startsWith('https://')) {
                        resultBox.innerHTML = `【読み取り成功】<br><a href="${code.data}" target="_blank">${code.data}</a>`;
                    } else {
                        resultBox.innerHTML = `【読み取り成功】<br>${code.data}`;
                    }

                    // ポップアップを表示
                    alert("読み取り成功！\n\n" + code.data);
                }
            }
            if (!isScanned) {
                requestAnimationFrame(tick);
            }
        }
    </script>
</body>
</html>
