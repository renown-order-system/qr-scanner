<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZXing QR認識テスト</title>
<script src="https://unpkg.com/@zxing/browser@latest"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:560px;margin:auto;padding:16px;text-align:center}
h1{font-size:25px;margin:8px 0 12px}
.note{background:#222;border-radius:10px;padding:12px;text-align:left;line-height:1.5;margin-bottom:12px}
video{width:100%;max-height:62vh;background:#000;border-radius:12px;object-fit:cover}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{min-height:58px;border:0;border-radius:10px;color:white;font-size:19px;font-weight:800}
#start{background:#087bd3} #stop{background:#555}
#status{background:#fff;color:#111;text-align:left;padding:12px;border-radius:10px;min-height:84px;margin-top:12px;word-break:break-all}
.ok{font-size:22px;font-weight:900;color:#087a38}
.err{font-weight:900;color:#b00020}
</style>
</head>
<body>
<div class="wrap">
<h1>ZXing QR認識テスト</h1>
<div class="note">
今回は <b>html5-qrcode を使用しません。</b><br>
ZXingで背面カメラ映像からQRコードを連続認識します。<br>
読み取った内容は下にそのまま表示します。
</div>

<video id="video" playsinline muted></video>

<div class="buttons">
<button id="start" type="button">カメラ開始</button>
<button id="stop" type="button">停止</button>
</div>

<div id="status">未開始</div>
</div>

<script>
let reader = null;
let controls = null;
let gotResult = false;

const statusBox = document.getElementById('status');
const video = document.getElementById('video');

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

async function stopScan(){
  if(controls){
    try{ controls.stop(); }catch(e){}
    controls = null;
  }
  gotResult = false;
  statusBox.textContent = 'カメラを停止しました。';
}

async function startScan(){
  if(controls) return;

  gotResult = false;
  statusBox.textContent = 'カメラを起動しています…';

  try{
    reader = new ZXingBrowser.BrowserQRCodeReader(undefined, {
      delayBetweenScanAttempts: 100
    });

    controls = await reader.decodeFromConstraints(
      {
        audio:false,
        video:{
          facingMode:{ideal:'environment'},
          width:{ideal:1920},
          height:{ideal:1080}
        }
      },
      video,
      (result, error) => {
        if(result && !gotResult){
          gotResult = true;
          const text = result.getText ? result.getText() : String(result.text || result);
          statusBox.innerHTML =
            '<div class="ok">QR読取成功</div><div>' + esc(text) + '</div>';
        }
      }
    );

    if(!gotResult){
      statusBox.textContent = 'カメラ起動成功。QRコードを枠いっぱいに近づけてください。';
    }
  }catch(e){
    controls = null;
    statusBox.innerHTML =
      '<div class="err">カメラ起動エラー</div><div>' +
      esc(e && e.message ? e.message : e) + '</div>';
  }
}

document.getElementById('start').addEventListener('click', startScan);
document.getElementById('stop').addEventListener('click', stopScan);

window.addEventListener('pagehide', () => {
  if(controls){
    try{ controls.stop(); }catch(e){}
  }
});
</script>
</body>
</html>
