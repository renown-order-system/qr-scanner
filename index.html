<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QRスキャナー</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h2 { margin: 8px 0 16px; font-size: 20px; }
    #reader {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      background: #222;
    }
    .cancel-btn {
      margin-top: 16px;
      padding: 12px 28px;
      background: #555;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>品番QRコードをスキャン</h2>
  <div id="reader"></div>
  <button class="cancel-btn" onclick="closeScanner()">閉じる</button>

  <script>
    function onScanSuccess(decodedText, decodedResult) {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear();
      }

      // 親ウィンドウ（GAS）へ品番データを送信
      if (window.opener) {
        window.opener.postMessage({ productNo: decodedText }, '*');
        window.close();
      } else {
        // 別タブ等で開かれた場合
        window.postMessage({ productNo: decodedText }, '*');
        window.close();
      }
    }

    function closeScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear();
      }
      window.close();
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 15,
        qrbox: { width: 250, height: 250 },
        rememberLastUsedCamera: true
      },
      false
    );

    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
