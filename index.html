<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>QRスキャナー</title>
  
  <!-- jsQR ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #111827;
      color: #ffffff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダー */
    .header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #1f2937;
      border-bottom: 1px solid #374151;
    }

    .header-title {
      font-size: 18px;
      font-weight: 800;
      color: #f9fafb;
    }

    .total-badge {
      background: #2563eb;
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 900;
    }

    /* カメラ映像エリア */
    .camera-container {
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      background: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    canvas {
      display: none;
    }

    /* スキャン枠ガイド */
    .scan-guide {
      position: absolute;
      width: 220px;
      height: 220px;
      border: 3px solid #10b981;
      border-radius: 16px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      transition: border-color 0.15s;
    }

    .scan-guide.flash {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4000px rgba(59, 130, 246, 0.3);
    }

    /* 下部：スキャン情報パネル */
    .info-panel {
      flex: 0 0 auto;
      padding: 12px 14px;
      background: #1f2937;
      border-top: 1px solid #374151;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .latest-card {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
    }

    .latest-info {
      flex: 1;
      min-width: 0;
    }

    .latest-label {
      font-size: 11px;
      color: #9ca3af;
      font-weight: 700;
    }

    .latest-id {
      font-size: 17px;
      font-weight: 900;
      color: #60a5fa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .latest-qty-badge {
      flex: 0 0 auto;
      margin-left: 10px;
      background: #059669;
      color: #ffffff;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 900;
      text-align: center;
    }

    /* ボタングループ */
    .button-group {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 8px;
    }

    .btn {
      height: 52px;
      border: 0;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-undo {
      background: #4b5563;
      color: #ffffff;
    }

    .btn-undo:disabled {
      background: #374151;
      color: #6b7280;
      opacity: 0.6;
    }

    .btn-confirm {
      background: #10b981;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="header">
    <div class="header-title">QRコード読取</div>
    <div id="totalBadge" class="total-badge">合計: 0 点</div>
  </div>

  <!-- カメラプレビュー -->
  <div class="camera-container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div id="scanGuide" class="scan-guide"></div>
  </div>

  <!-- 下部操作パネル -->
  <div class="info-panel">
    <div class="latest-card">
      <div class="latest-info">
        <div class="latest-label">最後に読んだ商品ID</div>
        <div id="latestId" class="latest-id">（未読取）</div>
      </div>
      <div id="latestQty" class="latest-qty-badge" style="display: none;">0 点目</div>
    </div>

    <div class="button-group">
      <button id="undoBtn" class="btn btn-undo" onclick="undoLastScan()" disabled>1つ取消</button>
      <button class="btn btn-confirm" onclick="finishAndConfirm()">確定して戻る</button>
    </div>
  </div>

  <script>
    /* =====================================================
       状態管理・スキャン履歴
       ===================================================== */
    const scannedCounts = {}; // { "7217107104_01_46": 2, ... }
    const scanHistory = [];   // ["7217107104_01_46", ...] （取り消し用スタック）
    let lastScannedCode = '';
    let lastScanTime = 0;
    const SCAN_COOLDOWN_MS = 1200; // 同一コードの重複防止ウェイト（1.2秒）

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scanGuide = document.getElementById('scanGuide');
    const latestIdEl = document.getElementById('latestId');
    const latestQtyEl = document.getElementById('latestQty');
    const totalBadgeEl = document.getElementById('totalBadge');
    const undoBtn = document.getElementById('undoBtn');

    /* =====================================================
       iOS/Android対応 高品質ビープ音（Web Audio API）
       ===================================================== */
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeepSound() {
      try {
        initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(1760, audioCtx.currentTime); // 1760Hz（クリアな高音ピピッ）

        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {
        console.error('Audio Error:', e);
      }
    }

    // 初回タップ時にオーディオコンテキストをアクティブ化
    window.addEventListener('touchstart', initAudio, { once: true });
    window.addEventListener('click', initAudio, { once: true });

    /* =====================================================
       カメラ起動・スキャンループ
       ===================================================== */
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        video.setAttribute('playsinline', true);
        await video.play();
        requestAnimationFrame(tick);
      } catch (err) {
        alert('カメラの起動に失敗しました。カメラの利用権限を許可してください。\n' + err.message);
      }
    }

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: 'dontInvert'
        });

        if (code && code.data) {
          handleDetectedCode(code.data.trim());
        }
      }
      requestAnimationFrame(tick);
    }

    /* =====================================================
       QR読み取り処理
       ===================================================== */
    function handleDetectedCode(rawCode) {
      const now = Date.now();

      // 同一コードかつクールダウン期間内の場合は無視
      if (rawCode === lastScannedCode && (now - lastScanTime) < SCAN_COOLDOWN_MS) {
        return;
      }

      // 商品ID形式（品番_色_サイズ）の簡易チェック
      // 例: 7217107104_01_46 または 通常品番
      lastScannedCode = rawCode;
      lastScanTime = now;

      // カウントアップ
      scannedCounts[rawCode] = (scannedCounts[rawCode] || 0) + 1;
      scanHistory.push(rawCode);

      // 音を鳴らし、枠を一瞬光らせる
      playBeepSound();
      flashScanGuide();

      // 画面表示の更新
      updateUi();
    }

    function flashScanGuide() {
      scanGuide.classList.add('flash');
      setTimeout(() => {
        scanGuide.classList.remove('flash');
      }, 200);
    }

    /* =====================================================
       取り消し・UI更新
       ===================================================== */
    function undoLastScan() {
      if (!scanHistory.length) return;

      const removedCode = scanHistory.pop();
      if (scannedCounts[removedCode]) {
        scannedCounts[removedCode]--;
        if (scannedCounts[removedCode] <= 0) {
          delete scannedCounts[removedCode];
        }
      }

      lastScannedCode = ''; // リセットして再読取しやすくする
      updateUi();
    }

    function updateUi() {
      const totalCount = Object.values(scannedCounts).reduce((a, b) => a + b, 0);
      totalBadgeEl.textContent = `合計: ${totalCount} 点`;

      if (scanHistory.length > 0) {
        const currentCode = scanHistory[scanHistory.length - 1];
        const currentCount = scannedCounts[currentCode] || 0;

        latestIdEl.textContent = currentCode;
        latestQtyEl.style.display = 'block';
        latestQtyEl.textContent = `${currentCount} 点目`;
        undoBtn.disabled = false;
      } else {
        latestIdEl.textContent = '（未読取）';
        latestQtyEl.style.display = 'none';
        undoBtn.disabled = true;
      }
    }

    /* =====================================================
       確定送信・親画面（GAS）連携
       ===================================================== */
    function finishAndConfirm() {
      const payload = {
        type: 'QR_SCAN_RESULT',
        counts: scannedCounts, // { "商品ID": 数量, ... }
        lastProductNo: getLastProductNo() // 最後にスキャンした品番（展開用）
      };

      // 親ウィンドウ（GAS）へデータ送信
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(payload, '*');
        window.close();
      } else if (window.parent && window.parent !== window) {
        window.parent.postMessage(payload, '*');
      } else {
        // 万が一単体で開いていた場合
        alert('読み取り結果を保存しました。発注画面へお戻りください。');
      }
    }

    function getLastProductNo() {
      if (!scanHistory.length) return '';
      const lastId = scanHistory[scanHistory.length - 1];
      // アンダースコア区切りの先頭（または先頭10桁）を品番とする
      if (lastId.includes('_')) {
        return lastId.split('_')[0];
      }
      return lastId.substring(0, 10);
    }

    // 起動
    window.addEventListener('load', startCamera);
  </script>
</body>
</html>
