<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>展示会 QRカメラテスト</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#111;color:#fff}
    .page{width:100%;max-width:560px;margin:0 auto;padding:18px;text-align:center}
    h1{margin:6px 0 12px;font-size:26px}
    .note{margin-bottom:14px;padding:12px;border-radius:10px;background:#222;font-size:16px;line-height:1.5;text-align:left}
    #reader{width:100%;min-height:300px;overflow:hidden;border-radius:12px;background:#000}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    button{min-height:58px;border:0;border-radius:10px;font-size:19px;font-weight:900;color:#fff}
    #startBtn{background:#0b7dda}
    #stopBtn{background:#555}
    #result{min-height:84px;margin-top:14px;padding:12px;border-radius:10px;background:#fff;color:#111;font-size:16px;line-height:1.5;text-align:left;word-break:break-all}
    .ok{color:#087a38;font-weight:900;font-size:20px}
    .error{color:#b00020;font-weight:900}
  </style>
</head>
<body>
<div class="page">
  <h1>QRカメラ テスト</h1>
  <div class="note">
    このページはGitHub Pages上で動いています。<br>
    「カメラ開始」を押して、カメラ使用を許可してください。<br>
    今回は発注システムとの連携はまだ行いません。
  </div>
  <div id="reader"></div>
  <div class="buttons">
    <button id="startBtn" type="button" onclick="startCamera()">カメラ開始</button>
    <button id="stopBtn" type="button" onclick="stopCamera()">停止</button>
  </div>
  <div id="result">未開始</div>
</div>

<script>
let qrScanner=null;
let isRunning=false;
let alreadyRead=false;

function showResult(html){
  document.getElementById('result').innerHTML=html;
}

async function startCamera(){
  if(isRunning)return;

  alreadyRead=false;
  showResult('カメラを起動しています…');

  try{
    qrScanner=new Html5Qrcode('reader');

    await qrScanner.start(
      {facingMode:'environment'},
      {
        fps:10,
        qrbox:function(width,height){
          const size=Math.floor(Math.min(width,height)*0.72);
          return {width:size,height:size};
        }
      },
      function(decodedText){
        if(alreadyRead)return;
        alreadyRead=true;
        showResult(
          '<div class="ok">QR読取成功</div><div>'+
          escapeHtml(decodedText)+
          '</div>'
        );
      },
      function(){}
    );

    isRunning=true;
    showResult('カメラ起動成功。QRコードを映してください。');
  }catch(error){
    isRunning=false;
    showResult(
      '<div class="error">カメラ起動エラー</div><div>'+
      escapeHtml(String(error&&error.message?error.message:error))+
      '</div>'
    );
  }
}

async function stopCamera(){
  if(!qrScanner||!isRunning){
    showResult('カメラは停止しています。');
    return;
  }

  try{await qrScanner.stop();}catch(error){}
  try{qrScanner.clear();}catch(error){}

  qrScanner=null;
  isRunning=false;
  showResult('カメラを停止しました。');
}

function escapeHtml(value){
  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

window.addEventListener('pagehide',function(){
  if(qrScanner&&isRunning){
    qrScanner.stop().catch(function(){});
  }
});
</script>
</body>
</html>
