<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QRスキャナー</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      padding: 16px 12px;
      overflow: hidden;
    }
    .header-title {
      font-size: 20px;
      font-weight: bold;
      margin-top: 8px;
    }
    #reader-container {
      width: 100%;
      max-width: 480px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
    }
    #reader video {
      border-radius: 12px;
      object-fit: cover;
    }
    .footer-actions {
      width: 100%;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
    }
    .cancel-btn {
      width: min(100%, 320px);
      height: 52px;
      background: #444;
      color: #fff;
      border: 0;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      touch-action: manipulation;
    }
    .cancel-btn:active {
      background: #222;
    }
  </style>
</head>
<body>

  <div class="header-title">品番QRコードをかざしてください</div>

  <div id="reader-container">
    <div id="reader"></div>
  </div>

  <div class="footer-actions">
    <button class="cancel-btn" onclick="closeScanner()">キャンセル</button>
  </div>

  <script>
    let html5QrCode = null;

    function startCamera() {
      html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 20, // 朝の爆速スキャン設定
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
          const qrboxSize = Math.floor(minEdge * 0.75);
          return {
            width: qrboxSize,
            height: qrboxSize
          };
        },
        aspectRatio: 1.0
      };

      // 背面カメラ（facingMode: "environment"）をダイレクト指定で起動
      html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        onScanFailure
      ).catch(err => {
        console.error("背面カメラ起動失敗、標準カメラを試行します", err);
        // 万一背面カメラ指定が弾かれた場合のフォールバック
        html5QrCode.start(
          { facingMode: "user" },
          config,
          onScanSuccess,
          onScanFailure
        ).catch(e => {
          alert("カメラの起動に失敗しました: " + e);
        });
      });
    }

    function onScanSuccess(decodedText, decodedResult) {
      // スキャン成功時に即停止
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          sendAndClose(decodedText);
        }).catch(() => {
          sendAndClose(decodedText);
        });
      } else {
        sendAndClose(decodedText);
      }
    }

    function sendAndClose(text) {
      if (window.opener) {
        window.opener.postMessage({ productNo: text }, '*');
      } else {
        window.postMessage({ productNo: text }, '*');
      }
      window.close();
    }

    function onScanFailure(error) {
      // スキャン探索中の通常ループは無視
    }

    function closeScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          window.close();
        }).catch(() => {
          window.close();
        });
      } else {
        window.close();
      }
    }

    // 画面ロード時に自動でカメラ開始
    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
