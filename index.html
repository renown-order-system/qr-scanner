<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BarcodeDetector QR診断</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:560px;margin:auto;padding:14px;text-align:center}
h1{font-size:24px;margin:8px 0 10px}
.box{padding:12px;border-radius:10px;margin-bottom:10px;text-align:left;line-height:1.5}
#support{background:#333}
video{width:100%;max-height:58vh;background:#000;border-radius:12px;object-fit:cover}
button{width:100%;min-height:58px;border:0;border-radius:10px;background:#087bd3;color:#fff;font-size:19px;font-weight:900;margin-top:10px}
#result{background:#fff;color:#111;min-height:90px;margin-top:10px;padding:12px;border-radius:10px;text-align:left;word-break:break-all}
.ok{color:#087a38;font-size:21px;font-weight:900}
.ng{color:#b00020;font-size:19px;font-weight:900}
</style>
</head>
<body>
<div class="wrap">
<h1>BarcodeDetector QR診断</h1>
<div id="support" class="box">対応状況を確認中…</div>
<video id="video" playsinline muted autoplay></video>
<button id="startBtn" type="button">カメラ開始</button>
<div id="result">未開始</div>
</div>

<script>
const support=document.getElementById('support');
const result=document.getElementById('result');
const video=document.getElementById('video');
let stream=null;
let detector=null;
let running=false;
let detecting=false;

function esc(v){
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

async function diagnose(){
  if(!('BarcodeDetector' in window)){
    support.innerHTML='<span class="ng">BarcodeDetector：非対応</span><br>このブラウザではネイティブQR認識を利用できません。';
    return false;
  }
  try{
    const formats=await BarcodeDetector.getSupportedFormats();
    const qr=formats.includes('qr_code');
    support.innerHTML=
      '<span class="'+(qr?'ok':'ng')+'">BarcodeDetector：対応</span><br>'+
      'QRコード：'+(qr?'対応':'非対応')+'<br>'+
      '対応形式：'+esc(formats.join(', '));
    if(!qr)return false;
    detector=new BarcodeDetector({formats:['qr_code']});
    return true;
  }catch(e){
    support.innerHTML='<span class="ng">BarcodeDetector診断エラー</span><br>'+esc(e.message||e);
    return false;
  }
}

async function start(){
  if(running)return;
  result.textContent='カメラを起動しています…';

  const supported=await diagnose();
  if(!supported){
    result.innerHTML='<span class="ng">この端末ではBarcodeDetectorによるQRテストを開始できません。</span>';
    return;
  }

  try{
    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:1920},
        height:{ideal:1080}
      }
    });
    video.srcObject=stream;
    await video.play();
    running=true;
    result.textContent='カメラ起動成功。QRコードを映してください。';
    requestAnimationFrame(scanLoop);
  }catch(e){
    result.innerHTML='<span class="ng">カメラ起動エラー</span><br>'+esc(e.message||e);
  }
}

async function scanLoop(){
  if(!running)return;
  if(!detecting && video.readyState>=2){
    detecting=true;
    try{
      const codes=await detector.detect(video);
      if(codes && codes.length){
        running=false;
        result.innerHTML='<div class="ok">QR読取成功</div><div>'+esc(codes[0].rawValue)+'</div>';
        return;
      }
    }catch(e){
      result.innerHTML='<span class="ng">認識エラー</span><br>'+esc(e.message||e);
    }finally{
      detecting=false;
    }
  }
  setTimeout(()=>requestAnimationFrame(scanLoop),100);
}

document.getElementById('startBtn').addEventListener('click',start);
window.addEventListener('pagehide',()=>{
  running=false;
  if(stream)stream.getTracks().forEach(t=>t.stop());
});
diagnose();
</script>
</body>
</html>
