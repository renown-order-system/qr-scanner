<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QRスキャナー</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      padding: 16px 12px;
      overflow: hidden;
    }
    .header-title {
      font-size: 20px;
      font-weight: bold;
      margin-top: 8px;
      text-align: center;
    }
    #reader-container {
      width: 100%;
      max-width: 480px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
    }
    #reader video {
      border-radius: 12px;
      object-fit: cover;
    }
    .footer-actions {
      width: 100%;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
    }
    .cancel-btn {
      width: min(100%, 320px);
      height: 52px;
      background: #444;
      color: #fff;
      border: 0;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      touch-action: manipulation;
    }
    .cancel-btn:active {
      background: #222;
    }

    /* 読取成功後のフォールバック表示 */
    #success-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #111;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 24px;
      text-align: center;
    }
    #success-overlay .success-icon {
      font-size: 56px;
      margin-bottom: 16px;
    }
    #success-overlay h2 {
      font-size: 22px;
      margin-bottom: 12px;
      color: #4ade80;
    }
    #success-overlay p {
      font-size: 16px;
      color: #ccc;
      margin-bottom: 32px;
    }
    #success-overlay .return-btn {
      width: 100%;
      max-width: 300px;
      height: 56px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      font-weight: bold;
      border: 0;
      border-radius: 10px;
      touch-action: manipulation;
    }
  </style>
</head>
<body>

  <div class="header-title" id="scan-title">品番QRコードをかざしてください</div>

  <div id="reader-container">
    <div id="reader"></div>
  </div>

  <div class="footer-actions" id="scan-footer">
    <button class="cancel-btn" onclick="closeScanner()">キャンセル</button>
  </div>

  <!-- Androidで閉じなかった場合の完了オーバーレイ -->
  <div id="success-overlay">
    <div class="success-icon">✅</div>
    <h2>読み取りが完了しました</h2>
    <p id="scanned-val-text">品番を送信しました。<br>元の発注画面へ戻ってください。</p>
    <button class="return-btn" onclick="closeScanner()">この画面を閉じる</button>
  </div>

  <script>
    let html5QrCode = null;
    let isProcessing = false;

    function startCamera() {
      html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 20,
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
          const qrboxSize = Math.floor(minEdge * 0.75);
          return {
            width: qrboxSize,
            height: qrboxSize
          };
        },
        aspectRatio: 1.0
      };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        onScanFailure
      ).catch(err => {
        console.error("背面カメラ起動失敗、標準カメラ試行", err);
        html5QrCode.start(
          { facingMode: "user" },
          config,
          onScanSuccess,
          onScanFailure
        ).catch(e => {
          alert("カメラの起動に失敗しました: " + e);
        });
      });
    }

    function onScanSuccess(decodedText, decodedResult) {
      if (isProcessing) return;
      isProcessing = true;

      // スマホバイブレーション（対応機種のみ）
      if (navigator.vibrate) {
        navigator.vibrate(100);
      }

      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          sendAndClose(decodedText);
        }).catch(() => {
          sendAndClose(decodedText);
        });
      } else {
        sendAndClose(decodedText);
      }
    }

    function sendAndClose(text) {
      // 1. 親ウィンドウにデータ送信
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ productNo: text }, '*');
      }

      // 2. 閉じる処理を試行
      window.close();

      // 3. window.close() がブロックされて閉じなかった場合のUI切り替え（200ms後）
      setTimeout(() => {
        document.getElementById('scanned-val-text').innerHTML = '品番: <strong>' + text + '</strong> を送信しました。<br>元の発注画面へ戻ってください。';
        document.getElementById('success-overlay').style.display = 'flex';
      }, 200);
    }

    function onScanFailure(error) {
      // 探索ループ
    }

    function closeScanner() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
          window.close();
          history.back(); // 閉じないブラウザへの追加策
        }).catch(() => {
          window.close();
          history.back();
        });
      } else {
        window.close();
        history.back();
      }
    }

    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
